<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"kind","type":"enum","label":"Peça","default":"intro","options":[{"value":"intro","label":"Intro"},{"value":"outro","label":"Tancament"}]},
    {"id":"kicker","type":"string","label":"Avantítol","default":"Tutorial"},
    {"id":"title","type":"string","label":"Títol","default":"Organiza tus tareas"},
    {"id":"subtitle","type":"string","label":"Subtítol","default":"Aprende a crear, completar y filtrar tareas paso a paso."},
    {"id":"bg1","type":"color","label":"Fons","default":"#eef1f6"},
    {"id":"bg2","type":"color","label":"Fons 2","default":"#dfe6f1"},
    {"id":"accent","type":"color","label":"Accent","default":"#2563eb"},
    {"id":"ink","type":"color","label":"Text","default":"#0f172a"},
    {"id":"muted","type":"color","label":"Secundari","default":"#64748b"},
    {"id":"font","type":"enum","label":"Lletra","default":"Inter","options":[{"value":"Inter","label":"Inter"},{"value":"Montserrat","label":"Montserrat"},{"value":"Poppins","label":"Poppins"},{"value":"Outfit","label":"Outfit"},{"value":"Playfair Display","label":"Playfair Display"},{"value":"Open Sans","label":"Open Sans"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg1: #eef1f6;
        --bg2: #dfe6f1;
        --accent: #2563eb;
        --ink: #0f172a;
        --muted: #64748b;
        --font: 'Inter';
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: absolute;
        inset: 0;
        font-family: var(--font), sans-serif;
        color: var(--ink);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      }
      /* Quadrícula fina que dona textura sense distraure. */
      #grid {
        position: absolute;
        inset: -120px;
        background-image:
          linear-gradient(to right, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px),
          linear-gradient(to bottom, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
      }
      #glow-a {
        width: 1100px;
        height: 1100px;
        left: -260px;
        top: -420px;
      }
      #glow-b {
        width: 900px;
        height: 900px;
        right: -240px;
        bottom: -420px;
      }
      #content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 200px;
      }
      #kicker {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
      }
      #kicker::before,
      #kicker::after {
        content: '';
        width: 46px;
        height: 3px;
        background: var(--accent);
        border-radius: 2px;
      }
      #title {
        margin-top: 30px;
        font-weight: 900;
        font-size: 108px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        max-width: 1500px;
      }
      #title .w {
        display: inline-block;
        white-space: pre;
      }
      #bar {
        margin: 44px auto 40px;
        width: 260px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: left center;
      }
      #subtitle {
        font-size: 38px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 1250px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #wipe {
        position: absolute;
        inset: 0;
        background: var(--accent);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="4.2" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="4.2" data-track-index="1"></div>
      <div id="glow-a" class="glow clip" data-start="0" data-duration="4.2" data-track-index="2"></div>
      <div id="glow-b" class="glow clip" data-start="0" data-duration="4.2" data-track-index="3"></div>
      <div id="content" class="clip" data-start="0" data-duration="4.2" data-track-index="4">
        <div id="kicker" data-var-text="kicker">Tutorial</div>
        <h1 id="title">Organiza tus tareas</h1>
        <div id="bar"></div>
        <p id="subtitle" data-var-text="subtitle">Aprende a crear, completar y filtrar tareas paso a paso.</p>
      </div>
      <div id="wipe" class="clip" data-start="0" data-duration="4.2" data-track-index="5"></div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}
      const root = document.documentElement
      for (const k of ['bg1', 'bg2', 'accent', 'ink', 'muted']) if (v[k]) root.style.setProperty(`--${k}`, v[k])
      if (v.font) root.style.setProperty('--font', `'${v.font}'`)
      const outro = v.kind === 'outro'

      // Títol partit en paraules per a animar-les una a una.
      const titleEl = document.getElementById('title')
      const words = String(v.title || titleEl.textContent).trim().split(/\s+/)
      titleEl.innerHTML = words.map((w) => `<span class="w">${w.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])} </span>`).join('')
      if (outro) {
        document.getElementById('kicker').textContent = v.kicker || '¡Gracias por verlo!'
      }

      const tl = gsap.timeline({ paused: true })
      // Fons viu: la quadrícula i les llums es mouen poc a poc durant tota la peça.
      tl.fromTo('#grid', { x: 0, y: 0 }, { x: -80, y: -40, duration: 4.2, ease: 'none' }, 0)
      tl.fromTo('#glow-a', { x: 0, y: 0, scale: 1 }, { x: 140, y: 60, scale: 1.08, duration: 4.2, ease: 'sine.inOut' }, 0)
      tl.fromTo('#glow-b', { x: 0, y: 0 }, { x: -120, y: -50, duration: 4.2, ease: 'sine.inOut' }, 0)

      // Cortina d'entrada amb el color d'accent.
      tl.fromTo('#wipe', { scaleX: 1, transformOrigin: 'right center' }, { scaleX: 0, duration: 0.55, ease: 'power3.inOut' }, 0.05)

      tl.fromTo('#kicker', { opacity: 0, y: 24, scaleX: 1.25 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.6, ease: 'power3.out' }, 0.35)
      tl.fromTo(
        '#title .w',
        { opacity: 0, y: 70, rotateX: -55, filter: 'blur(10px)' },
        { opacity: 1, y: 0, rotateX: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power4.out', stagger: 0.07 },
        0.5,
      )
      tl.fromTo('#bar', { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'expo.out' }, 0.9)
      tl.fromTo('#subtitle', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.1)

      // Eixida suau perquè el tall amb la captura no siga brusc.
      tl.fromTo('#content', { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.97, duration: 0.35, ease: 'power2.in' }, 3.8)

      window.__timelines['main'] = tl
      tl.seek(0)
    </script>
  </body>
</html>
